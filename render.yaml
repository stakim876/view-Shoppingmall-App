# Render Blueprint: 대시보드에서 New Blueprint → 이 저장소 연결 후 적용
# 배포 후 Environment에 DB_*, JWT_SECRET, CORS_ORIGIN 등을 반드시 설정하세요.
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: my-shop-api
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20.18.1"
